name: 🛡️ Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Block committed .env files
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Committed env file(s): $found"
            exit 1
          fi
          echo "OK - no committed .env"

      - name: Scan for live secret patterns
        run: |
          set -e
          PATTERNS='gh[pousr]_[A-Za-z0-9]{30,}|vcp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}'
          # .env.example / docs me placeholders allow karo
          HITS=$(git grep -nEI "$PATTERNS" -- . ':!*.example' ':!.github/workflows/secret-scan.yml' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential live secrets detected:"
            echo "$HITS" | sed 's/=.*/=<REDACTED>/'
            exit 1
          fi
          echo "OK - no live secret patterns"
